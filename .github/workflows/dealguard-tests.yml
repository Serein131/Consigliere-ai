name: DealGuard Regression
on:
  pull_request:
  push:
    branches: [feature/dealguard-constraint-engine, feature/dealguard-visible-dashboard]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and test deterministic deal checks
        run: |
          python -m py_compile app.py dealguard.py
          python -m unittest discover -s tests -v
