name: DealGuard Regression
on:
  pull_request:
  push:
    branches: [main, feature/v55-actionable-risk-20261103, feature/v54-consent-live-assist-20261103, feature/v53-unified-three-stage-20261102, feature/hybrid-product-v52-20261102, feature/dealguard-constraint-engine, feature/dealguard-visible-dashboard]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Flask for API integration tests
        run: python -m pip install "flask>=3.0.0"
      - name: Compile and test rule checks + hybrid API
        run: |
          python -m py_compile app.py dealguard.py assurance.py hybrid_service.py research/evidence_hybrid.py research/continuous_eval.py
          python -m unittest discover -s tests -v
      - name: Check browser JavaScript parses
        run: |
          python - <<'PY'
          import pathlib, re
          source=pathlib.Path("app.py").read_text(encoding="utf-8")
          match=re.search(r"<script>(.*?)</script>",source,re.S)
          if not match:
              raise SystemExit("No browser script found in app.py")
          pathlib.Path("/tmp/consigliere-ui.js").write_text(match.group(1),encoding="utf-8")
          PY
          node --check /tmp/consigliere-ui.js
      - name: Exercise three-stage browser behavior without any API keys
        run: node tests/check_v53_browser.js
      - name: Exercise consent-gated Live Assist without network or real microphone
        run: node tests/check_v54_live.js
      - name: Verify five v5.5 browser decision-guidance scenarios
        run: node tests/check_v55_actionable.js
      - name: Evaluate 60 synthetic audit cases (diagnostic, not a general accuracy claim)
        run: |
          python research/evaluate.py
      - name: Evaluate separate 20-case adversarial challenge set
        run: |
          python research/evaluate.py --cases research/challenge_cases.json --output research/challenge_report.md --json research/challenge_report.json
      - name: Measure v5.4 live alert sensitivity and false alarms on frozen synthetic cases
        run: python research/evaluate_live_alerts.py
      - name: Continuous assurance loop — 36-case rules-only non-regression gate
        run: |
          python research/continuous_eval.py --suite research/live_alert_challenge_v54.json \
            --out-dir /tmp/consigliere-eval --max-fn 3 --max-fp 2 --max-unsafe-pass 0 --expected-suite-git-sha1 ce4c3cf014c9c0fb7f141a62352c74ce3f197dc0
      - name: Attach continuous evaluation failures and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assurance-synthetic-evaluation
          path: /tmp/consigliere-eval/
          retention-days: 30
      - name: Attach synthetic benchmark and failure report
        uses: actions/upload-artifact@v4
        with:
          name: dealguard-synthetic-benchmark
          path: |
            research/benchmark_report.md
            research/benchmark_report.json
            research/challenge_report.md
            research/challenge_report.json
            research/live_alert_report_v54.md
            research/live_alert_report_v54.json
          retention-days: 30
