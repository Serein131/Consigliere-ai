name: DealGuard Regression
on:
  pull_request:
  push:
    branches: [feature/dealguard-constraint-engine, feature/dealguard-visible-dashboard]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and test deterministic deal checks
        run: |
          python -m py_compile app.py dealguard.py
          python -m unittest discover -s tests -v
      - name: Evaluate 60 synthetic audit cases (diagnostic, not a general accuracy claim)
        run: |
          python research/evaluate.py
      - name: Attach synthetic benchmark and failure report
        uses: actions/upload-artifact@v4
        with:
          name: dealguard-synthetic-benchmark
          path: |
            research/benchmark_report.md
            research/benchmark_report.json
          retention-days: 30
